<!DOCTYPE html>
<html>
<head>
  <title>The Pitch Visualizer</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f5f5f5; }
    h1 { margin-top: 30px; }
    form { margin: 30px; }
    textarea { width: 60%; height: 150px; }
    .storyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; margin-top: 40px; }
    .panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
    img { width: 100%; border-radius: 10px; }
    .caption { margin-top: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>🎬 The Pitch Visualizer</h1>
  <form method="POST">
    <textarea name="text" placeholder="Enter your story here (3–5 sentences)..."></textarea><br>
    <button type="submit">Generate Storyboard</button>
  </form>

  {% if storyboard %}
  <div class="storyboard">
    {% for scene in storyboard %}
      <div class="panel">
        <img src="{{ scene.image_url }}" alt="Scene Image">
        <div class="caption"><strong>Scene:</strong> {{ scene.scene }}</div>
      </div>
    {% endfor %}
  </div>
  {% endif %}
</body>
</html>
